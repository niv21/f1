name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/racing-game-birthday-r4catk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Settings -> Pages -> Source: "GitHub Actions" (a one-time switch;
      # GITHUB_TOKEN is not allowed to create the Pages site itself).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The game is a static site already: index.html sits at the repo root.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
